# Generated by live_home_config_projection from AI48Home Config + downstream sanitizer.
# This fixture must be refreshed when the Home downstream projection changes.
antigravity:
  tos-pause-window: "0"
auth-auto-refresh-workers: 0
credential-concurrency:
  busy-retry-max: 1s
  busy-retry-min: 250ms
  cleanup-interval: 5s
  cpa-cancel-bound: 5s
  cpa-heartbeat-timeout: 3s
  lifecycle-config-revision: 7
  max-limit: 1000000
  observation-barrier-revision: 0
  reclaim-grace: 5s
  release-flush-interval: 250ms
  release-max-backoff: 2s
credential-in-flight:
  max-aggregate-groups: 100000
  max-details: 10000
  max-part-bytes: 262144
  max-part-count: 64
  max-revision-bytes: 16777216
  max-string-bytes: 256
  snapshot-interval: 2s
  staging-retention: 1m
  stale-after: 10s
debug: false
disable-cooling: true
error-logs-max-files: 0
force-model-prefix: false
home-scheduler-protocol: 0
host: ""
logging-to-file: false
logs-max-total-size-mb: 0
max-retry-credentials: 0
max-retry-interval: 0
models:
  catalog: ""
  codex-catalog: ""
  devin-catalog: ""
plugins:
  configs: {}
  dir: ""
  enabled: false
port: 8317
proxy-url: ""
quota-exceeded:
  antigravity-credits: false
  switch-preview-model: false
  switch-project: false
request-log: false
request-retry: 0
trusted-proxies: []
usage-statistics-enabled: true
