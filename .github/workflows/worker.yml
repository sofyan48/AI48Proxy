name: Worker checks

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check Windows targets and test native loader
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets --target "$TARGET"
          cargo test --locked --lib --target "$TARGET" plugins::native::windows_tests

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check production installer plugin guard
        run: |
          bash -n install.sh scripts/test-install.sh
          bash scripts/test-install.sh
      - name: Format, lint, test and locked release build
        run: sh scripts/verify-worker.sh
      - name: Build non-root runtime image
        run: docker build --tag ai48proxy:ci .
      - name: Inspect image and verify executable
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ai48proxy:ci)" = '10001:10001'
          docker run --rm --network none --read-only ai48proxy:ci --version
