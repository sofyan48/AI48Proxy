name: Publish worker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: edge
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        env:
          EVENT_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            tag="$EVENT_TAG"
          else
            tag="$INPUT_TAG"
          fi
          if [ "$EVENT_NAME" = push ]; then
            {
              echo 'tags<<EOF'
              echo "ghcr.io/sofyan48/ai48proxy:$tag"
              echo 'ghcr.io/sofyan48/ai48proxy:latest'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "ghcr.io/sofyan48/ai48proxy:$tag"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
